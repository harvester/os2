on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      push:
        required: true
        type: boolean

jobs:
  build-os-related-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: harvester-os
            dockerfile: Dockerfile
            sbom: true
          - image: harvester-nvidia-driver-toolkit
            dockerfile: nvidia-driver-toolkit/Dockerfile
            # BuildKit caps generated SBOM attestations at 40MiB before export;
            # the SBOM for this image (built from baseos-headers) exceeds that.
            sbom: false
          - image: harvester-kernel-module-devel
            dockerfile: kernel-module-devel/Dockerfile
            sbom: false
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Generate os-release
      if: ${{ matrix.image == 'harvester-os' }}
      run: bash scripts/ci

    - name: Prepare entrypoint script for NV driver toolkit image
      if: ${{ matrix.image == 'harvester-nvidia-driver-toolkit' }}
      run: cp nvidia-driver-toolkit/entrypoint.sh .

    - name: Build and publish ${{ matrix.image }} image
      if: ${{ inputs.push == true }}
      uses: harvester/harvester-actions/actions/build-and-publish@a3d39c75b30420c5d4e2ce504a410c98a066ca79 # main
      with:
        release-tag-name: ${{ inputs.tag }}
        is-release: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        # OS releases are published to every registry.
        registries: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && 'docker-io,staging,prime' || 'auto' }}
        dockerfile: ${{ matrix.dockerfile }}
        image: ${{ matrix.image }}
        sbom: ${{ matrix.sbom }}
