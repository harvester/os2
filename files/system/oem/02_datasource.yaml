name: "Elemental cloud-config from a removable device"
stages:
  rootfs.before:
    - name: "Pull data from provider"
      datasource:
        providers: ["aws", "gcp", "openstack", "cdrom", "configdrive"]
        path: "/oem"
  initramfs:
  - name: "Pull data from provider"
    datasource:
      providers: ["aws", "gcp", "openstack", "cdrom", "configdrive"]
      path: "/oem"
